<!DOCTYPE html>
<html lang="pt" data-t="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a2b45">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>My Cycle+</title>
<style>
:root{--bg:#fbf4f0;--cd:#fff;--tx:#3a2430;--mu:#8d7280;--ac:#b4566f;--ac2:#e9defa;--wn:#7a2b45;--ln:#f0e1e4;--sh:0 8px 28px rgba(122,43,69,.09)}
@media(prefers-color-scheme:dark){html[data-t=auto]{--bg:#17111a;--cd:#251c29;--tx:#f4e8ee;--mu:#a8939f;--ac:#e59ab3;--ac2:#3b2e4d;--wn:#e8aac0;--ln:#37293a;--sh:0 8px 28px rgba(0,0,0,.35)}}
html[data-t=dark]{--bg:#17111a;--cd:#251c29;--tx:#f4e8ee;--mu:#a8939f;--ac:#e59ab3;--ac2:#3b2e4d;--wn:#e8aac0;--ln:#37293a;--sh:0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:600;margin:0;font-family:Georgia,'Times New Roman',serif}h1{font-size:28px}h2{font-size:21px;margin:22px 0 10px}h3{font-size:17px}
.sn,button,input,select,textarea,.mu,.nv{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.mu{color:var(--mu);font-size:14px}
.pg{max-width:640px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px 10px;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--cd);border-radius:24px;padding:18px;box-shadow:var(--sh);margin:12px 0}.big,.hn b{font-family:Georgia,serif}
.hero{background:linear-gradient(145deg,var(--wn),var(--ac));color:#fff;display:flex;gap:16px;align-items:center}
.hero .mu{color:#ffe9f0}.big{font-size:30px;line-height:1.1;margin:4px 0}
.ring{width:104px;height:104px;flex:none}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.row{display:flex;gap:12px}.row>*{flex:1}
.st b{display:block;font-size:26px;color:var(--wn)}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:20px;background:linear-gradient(145deg,#7a2b45,#b4566f);box-shadow:0 10px 22px rgba(122,43,69,.22);color:#fff;font-weight:600;font-size:16px;padding:12px 18px;cursor:pointer;transition:transform .15s;margin:10px 0}
.btn:active{transform:scale(.97)}.btn.s{background:var(--ac2);color:var(--wn);box-shadow:none}.btn.d{background:#a3334b;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ln);background:var(--cd);border-radius:18px;padding:10px 13px;min-height:44px;cursor:pointer;font-size:15px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--wn)}
.q .chip{flex:1 1 22%;text-align:center;padding:10px 4px;font-size:13px}.q .chip span{display:block;font-size:22px}
label{display:block;font:600 14px system-ui;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:50px;border:1.5px solid var(--ln);background:var(--bg);border-radius:16px;padding:10px 14px}
textarea{min-height:80px}input[type=range]{padding:0;accent-color:var(--ac)}
.err{color:#c0394f;font:14px system-ui}
.nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nv button{flex:1;background:none;border:0;min-height:56px;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nv button.on{color:var(--ac)}.nv svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font:12px system-ui;color:var(--mu)}
.cal button{aspect-ratio:1;border:0;border-radius:14px;background:none;font-size:15px;position:relative;cursor:pointer;padding:0}
.cal .p{background:var(--ac);color:#fff}.cal .f{background:none;color:var(--wn);border:1.5px dashed var(--ac)}
.cal .v{background:rgba(138,106,214,.18);color:inherit}
.cal .c{background:var(--wn);color:var(--bg)}
.cal .t{outline:2px solid var(--wn)}.cal .l::after{content:'';position:absolute;bottom:4px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:var(--wn)}
.lg:empty{display:none}.lg{display:flex;flex-wrap:wrap;gap:12px;font:13px system-ui;color:var(--mu);margin-top:12px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.av{border:0;cursor:pointer;font-family:Georgia,serif;width:52px;height:52px;flex:none;border-radius:50%;background:linear-gradient(145deg,var(--wn),var(--ac));color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--sh)}
.hn{flex:1;min-width:0;line-height:1.2}.hn b{display:block;font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;width:48px;height:48px;flex:none;border-radius:50%;border:0;background:var(--cd);box-shadow:var(--sh);color:var(--ac);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell i{position:absolute;top:-4px;right:-4px;min-width:21px;height:21px;border-radius:11px;background:#d6455f;color:#fff;font:700 11px system-ui;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
.nt{display:flex;gap:12px;align-items:flex-start}.nt .ic{width:42px;height:42px;flex:none;border-radius:50%;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:20px}
.nt .dot{width:10px;height:10px;border-radius:50%;background:#d6455f;margin-top:6px;flex:none}
.lav{width:108px;height:108px;border-radius:50%;background:linear-gradient(145deg,#7a2b45,#c9738d);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(122,43,69,.3)}
.lav svg{width:56px;height:56px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round}
.lnk{background:none;border:0;color:#7a2b45;font:600 15px system-ui;padding:14px;min-height:48px;margin-top:4px;cursor:pointer;text-decoration:underline}
#lbody{width:100%;max-width:280px}#lbody .btn{margin-top:12px}
.li2{text-align:center;font-size:26px;letter-spacing:6px;background:#fdf6f3;color:#3a2430}
.shk{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pp{position:relative;width:260px;height:260px;margin:12px auto;touch-action:none}.pp svg{position:absolute;inset:0;width:100%;height:100%}
.pp i{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;background:rgba(122,43,69,.3);transition:transform .15s}.pp i.on{background:#b4566f;transform:scale(1.5)}
.top{display:flex;justify-content:space-between;align-items:center}.top button{background:var(--cd);border:0;width:44px;height:44px;border-radius:50%;font-size:18px;box-shadow:var(--sh);color:var(--ac)}
.bar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--ac2),var(--ac));margin:4px 0 10px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 4px;border-bottom:1px solid var(--ln);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.sh{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sh[hidden],[hidden]{display:none!important}
.bd{position:absolute;inset:0;background:rgba(40,15,30,.45)}
.pn::before{content:'';display:block;width:42px;height:5px;border-radius:3px;background:var(--ln);margin:-8px auto 14px}.pn h2{margin-top:0;font-size:22px}.pn{position:relative;background:var(--cd);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .3s ease}
@keyframes up{from{transform:translateY(40%);opacity:0}}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--wn);color:#fff;padding:12px 20px;border-radius:20px;font:15px system-ui;z-index:40;max-width:88%;text-align:center}
.ful{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#f6dfe6,#e9defa 55%,#fbf4f0);color:#5a1f36;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.ful img{width:120px;height:120px;border-radius:30px;box-shadow:0 14px 40px rgba(122,43,69,.3);animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.07)}}
.ld{width:150px;height:5px;border-radius:3px;background:rgba(122,43,69,.15);margin-top:30px;overflow:hidden}.ld i{display:block;height:100%;background:#7a2b45;animation:ld 7s linear forwards}
@keyframes ld{from{width:0}to{width:100%}}
.ob{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto}
.bl{filter:blur(8px);cursor:pointer}
details{border-bottom:1px solid var(--ln);padding:12px 0}summary{font-weight:600;cursor:pointer;font-family:system-ui}
.note{font:13px system-ui;color:var(--mu);margin-top:8px}
@media(min-width:900px){.nv{max-width:520px;left:50%;transform:translateX(-50%);border-radius:24px 24px 0 0}}

/* ===== Ecrã de bloqueio ===== */
.lk{--l1:#f7e1e8;--l2:#e8ddf7;--l3:#fdf3ef;--lt:#5a1f36;--la:#7a2b45;--lk:rgba(255,255,255,.62);--lkb:rgba(255,255,255,.95);--le:#b3263f;--bo:1;position:fixed;inset:0;z-index:50;overflow:hidden;color:var(--lt);background:linear-gradient(165deg,var(--l1),var(--l2) 55%,var(--l3))}
@media(prefers-color-scheme:dark){html[data-t=auto] .lk{--l1:#2c1b31;--l2:#1e1627;--l3:#17111a;--lt:#f4e8ee;--la:#e59ab3;--lk:rgba(255,255,255,.07);--lkb:rgba(255,255,255,.13);--le:#ff9bb0;--bo:.4}}
html[data-t=dark] .lk{--l1:#2c1b31;--l2:#1e1627;--l3:#17111a;--lt:#f4e8ee;--la:#e59ab3;--lk:rgba(255,255,255,.07);--lkb:rgba(255,255,255,.13);--le:#ff9bb0;--bo:.4}
.lk-bg i{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--bc) 0,transparent 68%);opacity:var(--bo);will-change:transform}
.lk-bg .b1{width:440px;height:440px;left:-150px;top:-130px;--bc:rgba(233,150,176,.6);animation:dr1 17s ease-in-out infinite alternate}
.lk-bg .b2{width:400px;height:400px;right:-170px;top:32%;--bc:rgba(190,165,240,.55);animation:dr2 21s ease-in-out infinite alternate}
.lk-bg .b3{width:360px;height:360px;left:-90px;bottom:-130px;--bc:rgba(255,200,180,.6);animation:dr3 19s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(70px,90px) scale(1.12)}}@keyframes dr2{to{transform:translate(-80px,-60px) scale(1.15)}}@keyframes dr3{to{transform:translate(90px,-70px) scale(1.1)}}
.lk-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(20px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom))}
.lk-av{position:relative;width:104px;height:104px;margin-bottom:18px}
.lav{position:relative;width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,#7a2b45,#c9738d);display:flex;align-items:center;justify-content:center;color:#fff;font:600 44px Georgia,serif;box-shadow:0 16px 36px rgba(122,43,69,.32),inset 0 2px 0 rgba(255,255,255,.28);animation:lkfl 6s ease-in-out infinite}
.lk-av .r{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--la);opacity:0;animation:lkr 3.8s ease-out infinite}.lk-av .r2{animation-delay:1.9s}
.lk-bd{position:absolute;right:-3px;bottom:3px;width:32px;height:32px;border-radius:50%;background:#fff;color:#7a2b45;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(122,43,69,.25)}
.lk-bd svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes lkfl{50%{transform:translateY(-5px)}}@keyframes lkr{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.7);opacity:0}}
.lk h2{margin:0 0 4px;font:600 27px Georgia,serif;letter-spacing:.2px;color:var(--lt)}
.lk #lmsg{margin:0 0 26px;font-size:15px;color:var(--lt);opacity:.72}
.lk #lbody{width:100%;max-width:300px}
.dots{display:flex;gap:16px;justify-content:center;height:16px;margin:0 0 30px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.6px solid var(--la);opacity:.5;transition:background .18s,opacity .18s}
.dots i.on{background:var(--la);opacity:1}.dots i.p{animation:pop .24s ease}@keyframes pop{50%{transform:scale(1.4)}}
.kp{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center}
.k{width:76px;height:76px;min-height:0;padding:0;margin:0;border-radius:50%;border:1px solid var(--lkb);background:var(--lk);color:var(--lt);font:300 30px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px rgba(122,43,69,.09);transition:transform .12s,background .12s,color .12s}
.k:active{transform:scale(.9);background:var(--la);color:#fff}.k.g{background:none;border-color:transparent;box-shadow:none}span.k.g{pointer-events:none}
.k svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lk-h{position:absolute;width:1px;height:1px;min-height:0;padding:0;border:0;opacity:0;pointer-events:none}
.lk #lerr{min-height:24px;margin:16px 0 0;font:600 14px system-ui,sans-serif;color:var(--le)}
.lk .btn{max-width:280px;margin:14px auto 0;background:linear-gradient(145deg,#7a2b45,#b4566f);box-shadow:0 10px 24px rgba(122,43,69,.28)}
.lk .btn.s{background:var(--lk);color:var(--lt);border:1px solid var(--lkb);box-shadow:none;margin-top:4px}
.lk .li2{background:var(--lk);border:1px solid var(--lkb);color:var(--lt);border-radius:22px;min-height:58px;box-shadow:0 8px 20px rgba(122,43,69,.08);-webkit-user-select:text;user-select:text}
.lk:not([hidden]) .lk-av{animation:lkin .9s cubic-bezier(.2,.8,.2,1) backwards}
.lk:not([hidden]) h2{animation:lkup .7s .15s ease-out backwards}.lk:not([hidden]) #lmsg{animation:lkup .7s .25s ease-out backwards}
.lk:not([hidden]) .dots,.lk:not([hidden]) .li2,.lk:not([hidden]) .pp{animation:lkup .7s .32s ease-out backwards}
.lk:not([hidden]) .k{animation:lkup .6s calc(.38s + var(--i,0)*40ms) ease-out backwards}
@keyframes lkin{from{opacity:0;transform:scale(.7) translateY(12px)}}@keyframes lkup{from{opacity:0;transform:translateY(14px)}}
.lk.out{animation:lkout .43s ease-in forwards}.lk.out .lk-in{animation:lkzoom .43s ease-in forwards}
@keyframes lkout{to{opacity:0}}@keyframes lkzoom{to{transform:scale(1.05)}}
@media(max-height:700px){.lk-av{width:84px;height:84px;margin-bottom:12px}.lav{font-size:36px}.lk #lmsg{margin-bottom:16px}.dots{margin-bottom:18px}.kp{grid-template-columns:repeat(3,64px);gap:10px 20px}.k{width:64px;height:64px;font-size:26px}}
/* ===== Personagem viva ===== */
.mom *{transform-box:view-box}
.mo-body{transform-origin:60px 150px;animation:mobr 4.2s ease-in-out infinite}@keyframes mobr{50%{transform:scale(1.012,1.018)}}
.mo-halo{transform-origin:60px 78px;animation:moha 5s ease-in-out infinite}@keyframes moha{50%{transform:scale(1.07)}}
.mo-belly{transform-origin:60px 104px;animation:mobl 3s ease-in-out infinite}@keyframes mobl{50%{transform:scale(1.05)}}
.mo-head{transform-origin:60px 56px;animation:moh 12s ease-in-out infinite}
@keyframes moh{0%,12%{transform:rotate(0)}20%,32%{transform:rotate(-7deg) translateX(-1px)}42%,56%{transform:rotate(7deg) translateX(1px)}66%{transform:rotate(0)}72%,90%{transform:rotate(5deg) translateY(.6px)}97%,100%{transform:rotate(0)}}
.mo-face{animation:mof 12s ease-in-out infinite}
@keyframes mof{0%,12%{transform:translateX(0)}20%,32%{transform:translateX(-3.5px)}42%,56%{transform:translateX(3.5px)}66%,100%{transform:translateX(0)}}
.mo-eyes{transform-origin:60px 38px;animation:moey 4.2s infinite}@keyframes moey{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mo-wave{opacity:0;animation:mow 12s ease-in-out infinite}@keyframes mow{0%,68%{opacity:0}70%,91%{opacity:1}93%,100%{opacity:0}}
.mo-hug{animation:mohug 12s ease-in-out infinite}@keyframes mohug{0%,68%{opacity:1}70%,91%{opacity:0}93%,100%{opacity:1}}
.mo-arm{transform-origin:77px 78px;animation:moarm .7s ease-in-out infinite alternate}@keyframes moarm{from{transform:rotate(-12deg)}to{transform:rotate(15deg)}}

/* ===== Abertura ===== */
#splash{overflow:hidden}#splash>*:not(.lk-bg){position:relative;z-index:1}
#splash h1{animation:lkup .8s .35s ease-out backwards;font-family:Georgia,serif;letter-spacing:.3px}
#splash p{animation:lkup .8s .55s ease-out backwards;margin:6px 0 0;opacity:.8}
#splash .ld{animation:lkup .8s .75s ease-out backwards;width:120px}
/* ===== Boas-vindas ===== */
.ob{--w1:#f8dde6;--w2:#e6dbf8}
@media(prefers-color-scheme:dark){html[data-t=auto] .ob{--w1:#3a2340;--w2:#241a31}}
html[data-t=dark] .ob{--w1:#3a2340;--w2:#241a31}
.wl{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wl-hero{position:relative;height:clamp(290px,44vh,360px);flex:none;background:linear-gradient(165deg,var(--w1),var(--w2));border-radius:0 0 46px 46px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;padding-top:calc(54px + env(safe-area-inset-top))}
.wl-hero .gx{height:100%;width:auto;animation:lkin 1s .1s cubic-bezier(.2,.8,.2,1) backwards}
.wl-br{position:absolute;left:20px;top:calc(16px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;font:600 19px Georgia,serif;color:var(--wn);animation:lkup .7s ease-out backwards}.wl-br img{border-radius:10px;box-shadow:0 4px 12px rgba(122,43,69,.2)}
.wl-b{padding:26px 24px 8px}
.wl-i{animation:lkup .7s calc(.35s + var(--i)*90ms) ease-out backwards}
.wl-b h1{font-size:30px;line-height:1.15;letter-spacing:.1px;color:var(--tx)}
.wl-s{margin:8px 0 0;font:italic 18px Georgia,serif;color:var(--ac)}
.wl-l{margin:14px 0 22px;font:16px/1.55 system-ui,sans-serif;color:var(--tx);opacity:.82}
.wl-f{display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--ln)}
.wl-ic{flex:none;width:48px;height:48px;border-radius:16px;background:var(--ac2);color:var(--wn);display:flex;align-items:center;justify-content:center}
.wl-ic svg,.stp-i svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wl-f h3{font:600 17px/1.3 Georgia,serif;margin:2px 0 4px}.wl-f p{margin:0;font:14.5px/1.5 system-ui,sans-serif;color:var(--mu)}
.wl-n{margin:6px 0 16px;font:12.5px/1.5 system-ui,sans-serif;color:var(--mu);text-align:center}
.ob-bar{position:sticky;bottom:0;z-index:3;margin-top:auto;padding:22px 22px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.ob-bar .btn{max-width:480px;margin:0 auto;min-height:58px;border-radius:20px;font-size:17px;background:linear-gradient(145deg,#7a2b45,#b4566f);box-shadow:0 12px 26px rgba(122,43,69,.28)}
.ob0 .ob-bar{background:linear-gradient(to top,var(--bg) 78%,transparent)}
/* ===== Cadastro ===== */
.ob-w{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 22px 8px;animation:obin .45s ease-out}
@keyframes obin{from{opacity:0;transform:translateX(18px)}}
.ob-top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.ob-back{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--cd);box-shadow:var(--sh);color:var(--wn);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}.ob-back:active{transform:scale(.92)}
